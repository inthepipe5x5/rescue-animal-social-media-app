<!-- Animal Types Modal -->
<div class="modal fade custom-modal" id="animalTypesModal" tabindex="-1" aria-labelledby="animalTypesModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="animalTypesModalLabel">Customize Animal Preferences By Type</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="d-grid gap-2">
            {% for animal_type in animal_types %}
              <a href="{{ url_for('animal_preferences', animal_type=animal_type) }}" class='"btn btn-{{ "primary" if animal_type in session["ANIMAL_TYPES"] else "info" }}'>
                {{ animal_emojis[animal_type] }} {{ animal_type|replace('-', ' ')|title }} Preferences
              </a>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
  </div>
